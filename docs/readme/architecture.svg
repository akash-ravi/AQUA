<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="Architecture: the Android app reads the screen and performs gestures, the Jarvis backend runs the agent loop and guardrails, and Claude picks one action per turn.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB77A"/>
      <stop offset="0.5" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#FF3B4E"/>
    </linearGradient>
    <radialGradient id="orbCore" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#FFF3EC"/>
      <stop offset="0.3" stop-color="#FFB77A"/>
      <stop offset="0.7" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#FF3B4E"/>
    </radialGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
    <path id="p2b" d="M384 236 H486"/>
    <path id="b2p" d="M486 276 H384"/>
    <path id="b2c" d="M856 236 H958"/>
    <path id="c2b" d="M958 276 H856"/>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .flow { stroke-dasharray: 3 7; animation: flow 1.2s linear infinite; }
      .flowR { stroke-dasharray: 3 7; animation: flow 1.2s linear infinite reverse; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      .orb { transform-box: fill-box; transform-origin: center; animation: orb 2s ease-in-out infinite; }
      @keyframes orb { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
      .stage { animation: stage 8s ease-in-out infinite; }
      @keyframes stage { 0%,100% { stroke: #614036; } 6%,18% { stroke: #FF6B35; } 26% { stroke: #614036; } }
    </style>
  </defs>
  <rect width="1280" height="520" rx="28" fill="#100C0B"/>

  <!-- PHONE -->
  <rect x="40" y="40" width="344" height="440" rx="24" fill="#211714" stroke="#FF6B35" stroke-opacity=".7"/>
  <g class="sans">
    <text x="72" y="82" font-size="13" font-weight="700" letter-spacing="2" fill="#FF6B35">ANDROID APP · KOTLIN</text>
    <text x="72" y="110" font-size="22" font-weight="700" fill="#FFF3EC">Eyes, hands, voice</text>
  </g>
  <g class="sans">
    <rect x="68" y="134" width="288" height="78" rx="14" fill="#100C0B" stroke="#614036"/>
    <text x="88" y="164" font-size="16" font-weight="600" fill="#FFF3EC">Voice</text>
    <text x="88" y="188" font-size="13" fill="#CCADA0">on-device ASR · interruptible TTS</text>

    <rect x="68" y="222" width="288" height="78" rx="14" fill="#100C0B" stroke="#614036"/>
    <text x="88" y="252" font-size="16" font-weight="600" fill="#FFF3EC">Accessibility service</text>
    <text x="88" y="276" font-size="13" fill="#CCADA0">reads the UI tree · performs gestures</text>

    <rect x="68" y="310" width="288" height="78" rx="14" fill="#100C0B" stroke="#614036"/>
    <text x="88" y="342" font-size="16" font-weight="600" fill="#FFF3EC">Orb + edge aura</text>
    <text x="88" y="366" font-size="13" fill="#CCADA0">shows status · Pause · Stop · answers</text>

    <text x="72" y="430" font-size="13" fill="#CCADA0">Also: default-assistant gesture,</text>
    <text x="72" y="450" font-size="13" fill="#CCADA0">on-phone confirmation guard</text>
  </g>

  <!-- PHONE <-> BRAIN -->
  <use href="#p2b" stroke="#FF6B35" stroke-width="2.5" class="flow"/>
  <use href="#b2p" stroke="#FFB77A" stroke-width="2.5" class="flow"/>
  <g><circle r="7" fill="#FF6B35" filter="url(#glow)"/><circle r="4" fill="#FFF3EC"/>
    <animateMotion dur="2s" repeatCount="indefinite"><mpath href="#p2b"/></animateMotion></g>
  <g><circle r="7" fill="#FFB77A" filter="url(#glow)"/><circle r="4" fill="#FFF3EC"/>
    <animateMotion dur="2s" begin="1s" repeatCount="indefinite"><mpath href="#b2p"/></animateMotion></g>
  <g class="mono" font-size="12" text-anchor="middle">
    <text x="435" y="222" fill="#FF6B35">screen</text>
    <text x="435" y="300" fill="#FFB77A">command</text>
  </g>
  <text x="435" y="340" class="sans" font-size="11.5" fill="#CCADA0" text-anchor="middle">WebSocket</text>
  <text x="435" y="356" class="sans" font-size="11.5" fill="#CCADA0" text-anchor="middle">JSON v1</text>

  <!-- BRAIN -->
  <rect x="486" y="40" width="370" height="440" rx="24" fill="#211714" stroke="#FF3B4E" stroke-opacity=".7"/>
  <g class="sans">
    <text x="518" y="82" font-size="13" font-weight="700" letter-spacing="2" fill="#FF3B4E">JARVIS BACKEND · PYTHON</text>
    <text x="518" y="110" font-size="22" font-weight="700" fill="#FFF3EC">The brain</text>
  </g>
  <g class="sans">
    <rect x="514" y="134" width="314" height="56" rx="14" fill="#100C0B" stroke="#614036" class="stage" style="animation-delay:0s"/>
    <text x="534" y="168" font-size="15" font-weight="600" fill="#FFF3EC">Screen → numbered outline</text>
    <path d="M671 190 v14" stroke="#614036" stroke-width="2"/>
    <rect x="514" y="204" width="314" height="56" rx="14" fill="#100C0B" stroke="#614036" class="stage" style="animation-delay:2s"/>
    <text x="534" y="238" font-size="15" font-weight="600" fill="#FFF3EC">Agent loop · one action per turn</text>
    <path d="M671 260 v14" stroke="#614036" stroke-width="2"/>
    <rect x="514" y="274" width="314" height="56" rx="14" fill="#100C0B" stroke="#614036" class="stage" style="animation-delay:4s"/>
    <text x="534" y="308" font-size="15" font-weight="600" fill="#FFF3EC">Guardrails · approve · proof</text>
    <path d="M671 330 v14" stroke="#614036" stroke-width="2"/>
    <rect x="514" y="344" width="314" height="56" rx="14" fill="#100C0B" stroke="#614036" class="stage" style="animation-delay:6s"/>
    <text x="534" y="378" font-size="15" font-weight="600" fill="#FFF3EC">Notebook · JSONL, fsynced</text>
    <text x="518" y="440" font-size="13" fill="#CCADA0">FastAPI · budgets · retries · fallback</text>
    <text x="518" y="460" font-size="13" fill="#CCADA0">Streamlit dashboard for every run</text>
  </g>

  <!-- BRAIN <-> CLAUDE -->
  <use href="#b2c" stroke="#FF3B4E" stroke-width="2.5" class="flow"/>
  <use href="#c2b" stroke="#FFB77A" stroke-width="2.5" class="flow"/>
  <g><circle r="7" fill="#FF3B4E" filter="url(#glow)"/><circle r="4" fill="#FFF3EC"/>
    <animateMotion dur="2s" begin=".5s" repeatCount="indefinite"><mpath href="#b2c"/></animateMotion></g>
  <g><circle r="7" fill="#FFB77A" filter="url(#glow)"/><circle r="4" fill="#FFF3EC"/>
    <animateMotion dur="2s" begin="1.5s" repeatCount="indefinite"><mpath href="#c2b"/></animateMotion></g>
  <g class="mono" font-size="12" text-anchor="middle">
    <text x="907" y="222" fill="#FF3B4E">prompt</text>
    <text x="907" y="300" fill="#FFB77A">1 tool call</text>
  </g>

  <!-- CLAUDE -->
  <rect x="958" y="40" width="282" height="440" rx="24" fill="#211714" stroke="#FFB77A" stroke-opacity=".7"/>
  <g class="sans">
    <text x="990" y="82" font-size="13" font-weight="700" letter-spacing="2" fill="#FFB77A">CLAUDE · OPUS 5.5</text>
    <text x="990" y="110" font-size="22" font-weight="700" fill="#FFF3EC">The judgment</text>
  </g>
  <g class="mono" font-size="13.5" fill="#FFF3EC">
    <rect x="986" y="134" width="226" height="266" rx="14" fill="#100C0B" stroke="#614036"/>
    <text x="1006" y="164">tap</text><text x="1106" y="164">type_text</text>
    <text x="1006" y="194">scroll</text><text x="1106" y="194">go_back</text>
    <text x="1006" y="224">go_home</text><text x="1106" y="224">open_app</text>
    <text x="1006" y="254">wait</text><text x="1106" y="254">look</text>
    <text x="1006" y="284" fill="#FFB77A">ask_user</text>
    <text x="1006" y="314" fill="#FF6B35">confirm_and_tap</text>
    <text x="1006" y="344" fill="#8FD18A">finish</text><text x="1106" y="344" fill="#CCADA0">give_up</text>
    <text x="1006" y="380" font-size="12" fill="#CCADA0">12 strict, typed tools</text>
  </g>
  <g class="sans">
    <text x="990" y="440" font-size="13" fill="#CCADA0">Prompt caching · effort control</text>
    <text x="990" y="460" font-size="13" fill="#CCADA0">server-side model fallback</text>
  </g>
</svg>
