<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="1.3 billion people live with a significant disability. 2.2 billion have a vision impairment. By 2030, 1 in 6 people will be 60 or older. Source: WHO.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB77A"/>
      <stop offset="0.5" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#FF3B4E"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
    <symbol id="person" viewBox="0 0 24 40">
      <circle cx="12" cy="7" r="6"/>
      <path d="M2 40 V22 a10 10 0 0 1 20 0 V40 z"/>
    </symbol>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .rise { opacity: 0; animation: rise 10s ease-out infinite; }
      @keyframes rise { 0% { opacity: 0; transform: translateY(14px); } 6%,92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      .lit { animation: lit 2.4s ease-in-out infinite; }
      @keyframes lit { 0%,100% { fill: #FF6B35; } 50% { fill: #FFB77A; } }
      .halo { animation: halo 2.4s ease-in-out infinite; }
      @keyframes halo { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
      .wave { opacity: 0; transform-box: fill-box; transform-origin: left center; animation: wave 2.4s ease-out infinite; }
      @keyframes wave { 0% { opacity: 0; transform: scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }
      .w2 { animation-delay: .4s; } .w3 { animation-delay: .8s; }
      .sand { animation: sand 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      @keyframes sand { 0% { transform: scaleY(.2); } 80%,100% { transform: scaleY(1); } }
      .flip { transform-box: fill-box; transform-origin: center; animation: flip 3s ease-in-out infinite; }
      @keyframes flip { 0%,85% { transform: rotate(0); } 100% { transform: rotate(180deg); } }
    </style>
  </defs>
  <rect width="1280" height="470" rx="28" fill="#100C0B"/>

  <!-- tile 1: disability, 1 in 6 people -->
  <g class="rise" style="animation-delay:0s">
    <rect x="40" y="40" width="384" height="360" rx="22" fill="#211714" stroke="#614036"/>
    <g fill="#30211D" transform="translate(84 76)">
      <use href="#person" x="0" width="36" height="60"/>
      <use href="#person" x="50" width="36" height="60"/>
      <use href="#person" x="100" width="36" height="60"/>
      <use href="#person" x="150" width="36" height="60"/>
      <use href="#person" x="200" width="36" height="60"/>
      <circle cx="268" cy="30" r="30" fill="#FF6B35" filter="url(#glow)" class="halo"/>
      <use href="#person" x="250" width="36" height="60" class="lit"/>
    </g>
    <text x="72" y="222" class="sans" font-size="66" font-weight="800" fill="url(#brand)">1.3B</text>
    <text x="72" y="262" class="sans" font-size="19" font-weight="600" fill="#FFF3EC">people live with a significant</text>
    <text x="72" y="288" class="sans" font-size="19" font-weight="600" fill="#FFF3EC">disability. That's 1 in 6 of us.</text>
    <text x="72" y="340" class="sans" font-size="14.5" fill="#CCADA0">Every tap-heavy app is a barrier</text>
    <text x="72" y="362" class="sans" font-size="14.5" fill="#CCADA0">someone has to work around.</text>
  </g>

  <!-- tile 2: vision -->
  <g class="rise" style="animation-delay:.5s">
    <rect x="448" y="40" width="384" height="360" rx="22" fill="#211714" stroke="#614036"/>
    <g transform="translate(560 106)">
      <path d="M-50 0 Q0 -40 50 0 Q0 40 -50 0 z" fill="none" stroke="#CCADA0" stroke-width="3.5"/>
      <circle r="13" fill="#CCADA0"/>
      <line x1="-46" y1="34" x2="46" y2="-34" stroke="#FF3B4E" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g fill="none" stroke="#FF6B35" stroke-width="3.5" stroke-linecap="round">
      <path d="M640 86 q14 20 0 40" class="wave"/>
      <path d="M656 76 q22 30 0 60" class="wave w2"/>
      <path d="M672 66 q30 40 0 80" class="wave w3"/>
    </g>
    <text x="700" y="112" class="sans" font-size="13" font-weight="700" letter-spacing="1.5" fill="#FF6B35">AQUA</text>
    <text x="700" y="130" class="sans" font-size="13" font-weight="700" letter-spacing="1.5" fill="#FF6B35">SPEAKS</text>
    <text x="480" y="222" class="sans" font-size="66" font-weight="800" fill="url(#brand)">2.2B</text>
    <text x="480" y="262" class="sans" font-size="19" font-weight="600" fill="#FFF3EC">people have a near or distance</text>
    <text x="480" y="288" class="sans" font-size="19" font-weight="600" fill="#FFF3EC">vision impairment.</text>
    <text x="480" y="340" class="sans" font-size="14.5" fill="#CCADA0">Phones are built for eyes. Aqua</text>
    <text x="480" y="362" class="sans" font-size="14.5" fill="#CCADA0">reads the screen and talks you through it.</text>
  </g>

  <!-- tile 3: ageing -->
  <g class="rise" style="animation-delay:1s">
    <rect x="856" y="40" width="384" height="360" rx="22" fill="#211714" stroke="#614036"/>
    <g transform="translate(1048 106)">
      <g class="flip">
        <path d="M-26 -40 h52 M-26 40 h52" stroke="#CCADA0" stroke-width="4" stroke-linecap="round"/>
        <path d="M-20 -40 C-20 -10 -4 -6 0 0 C4 -6 20 -10 20 -40 Z M-20 40 C-20 10 -4 6 0 0 C4 6 20 10 20 40 Z" fill="none" stroke="#CCADA0" stroke-width="3"/>
        <path d="M-15 38 C-14 22 -4 14 0 8 C4 14 14 22 15 38 Z" fill="#FF6B35" class="sand"/>
      </g>
    </g>
    <text x="888" y="222" class="sans" font-size="66" font-weight="800" fill="url(#brand)">1 in 6</text>
    <text x="888" y="262" class="sans" font-size="19" font-weight="600" fill="#FFF3EC">people worldwide will be 60 or</text>
    <text x="888" y="288" class="sans" font-size="19" font-weight="600" fill="#FFF3EC">older by 2030.</text>
    <text x="888" y="340" class="sans" font-size="14.5" fill="#CCADA0">Every redesign moves the buttons.</text>
    <text x="888" y="362" class="sans" font-size="14.5" fill="#CCADA0">A sentence never moves.</text>
  </g>

  <text x="640" y="440" class="sans" font-size="13" fill="#CCADA0" text-anchor="middle">Sources: World Health Organization fact sheets on disability (2023), vision impairment (2023) and ageing (2022).</text>
</svg>
